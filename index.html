<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Car Learning Garage</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div class="app">
  <header>
    <div>
      <p class="eyebrow">Little Driver</p>
      <h1>Car Learning Garage</h1>
    </div>

    <button id="voiceToggle">Voice: On</button>
  </header>

  <main>
    <section class="vehicle-card">
      <div id="vehicleEmoji" class="emoji">🚗</div>

      <p id="vehicleType" class="type">
        Everyday Vehicle
      </p>

      <h2 id="vehicleName">Car</h2>

      <p id="vehicleFact">
        A car helps people go from one place to another.
      </p>

      <div class="buttons">
        <button id="backButton">Back</button>
        <button id="sayButton" class="primary">
          Say It
        </button>
        <button id="nextButton">Next</button>
      </div>
    </section>
  </main>
</div>

<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
